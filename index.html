<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;

        height: 100vh;
        margin: 0;

    .container {

        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
